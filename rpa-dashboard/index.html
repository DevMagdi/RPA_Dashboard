<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="RPA CoE Control Room — single-tenant, On-Premises, vendor-neutral RPA operations for banks and large enterprises" />
    <!-- Bank deployments are often air-gapped: every font is self-hosted. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cairo-arabic-wght-normal.woff2" crossorigin />
    <title>Control Room</title>
    <style>
      /* First-paint canvas: matches the light-first tokens in src/index.css so
         the boot screen and the app never disagree about the background. */
      html {
        background: #f1f5fb;
      }
      html.dark {
        background: #020617;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: 'Inter Variable', 'Cairo Variable', system-ui, sans-serif;
        color: #4f46e5;
        background:
          radial-gradient(900px 520px at 100% -10%, rgba(79, 70, 229, 0.1), transparent 70%),
          radial-gradient(700px 420px at -10% 110%, rgba(13, 148, 136, 0.08), transparent 72%);
      }
      #boot .ring {
        width: 34px;
        height: 34px;
        border-radius: 999px;
        border: 2.5px solid rgba(79, 70, 229, 0.18);
        border-top-color: #4f46e5;
        animation: boot-spin 0.9s linear infinite;
      }
      #boot .label {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.65;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring {
          animation-duration: 2.4s;
        }
      }
    </style>
    <script>
      // Apply an explicit saved theme before first paint; new and legacy-default visits start Light.
      try {
        var savedTheme = localStorage.getItem('rpa.theme')
        var theme = savedTheme ? JSON.parse(savedTheme) : 'light'
        if (theme === 'system') theme = 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        var lang = localStorage.getItem('rpa.lang') || 'en'
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
        document.documentElement.dataset.locale = lang === 'ar' ? 'ar-EG-u-nu-latn' : 'en-GB'
      } catch (e) {
        /* storage disabled — keep Light defaults */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <div class="ring"></div>
      <div class="label">Control Room</div>
    </div>
    <script type="module">
      // The boot splash is removed as soon as React has painted its first frame
      // (see main.jsx) — it exists purely to avoid a blank screen on cold start.
      window.__RPA_BOOT__ = document.getElementById('boot')
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
