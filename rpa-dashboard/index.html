<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4b367c" />
    <meta name="description" content="Intelligent Automation Control Room — multi-tenant, multi-vendor RPA operations" />
    <!-- Bank deployments are often air-gapped: no external CDN, fonts fall back to system stacks -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Control Room</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme
      try {
        var theme = localStorage.getItem('rpa.theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var dark = theme ? theme === 'dark' : prefersDark
        document.documentElement.classList.toggle('dark', dark)
        var lang = localStorage.getItem('rpa.lang') || 'en'
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {
        /* storage disabled — keep defaults */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
