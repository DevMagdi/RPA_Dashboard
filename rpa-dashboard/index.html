<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F6FA" />
    <meta name="description" content="RPA CoE Control Room — single-tenant, On-Premises, vendor-neutral RPA operations for banks and large enterprises" />
    <!-- Bank deployments are often air-gapped: no external CDN, fonts fall back to system stacks -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Control Room</title>
    <script>
      // Apply an explicit saved theme before first paint; new and legacy-default visits start Light.
      try {
        var savedTheme = localStorage.getItem('rpa.theme')
        var theme = savedTheme ? JSON.parse(savedTheme) : 'light'
        if (theme === 'system') theme = 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        var lang = localStorage.getItem('rpa.lang') || 'en'
        document.documentElement.lang = lang
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
      } catch (e) {
        /* storage disabled — keep Light defaults */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
