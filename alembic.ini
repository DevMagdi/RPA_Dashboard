# Alembic configuration for the Control Room data model.
#
# The database URL is *not* stored here: `db/migrations/env.py` reads it from
# app.core.config.settings (DB_DIALECT / DB_* environment variables) so the same
# migration set runs against SQL Server, PostgreSQL or SQLite without edits and
# without a connection string in the repository.

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
