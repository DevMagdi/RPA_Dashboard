# ============================================================================
# RPA CoE Control Room — nginx site (SPA + API reverse proxy)
# Used by rpa-dashboard/Dockerfile.  Build context is the repository root.
# ============================================================================

upstream control_room_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- security headers -------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'" always;
    # Enable only when TLS terminates here (or upstream) — see DEPLOYMENT docs.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10m;

    # ---- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://control_room_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- Server-Sent Events: buffering MUST stay off -----------------------
    location /api/realtime/events {
        proxy_pass http://control_room_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # ---- WebSockets (agent + console channels) -----------------------------
    location /ws/ {
        proxy_pass http://control_room_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 24h;
    }

    # ---- health / metrics (restrict metrics at the network layer) ----------
    location = /health {
        proxy_pass http://control_room_api;
        access_log off;
    }

    # ---- SPA fallback --------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long-lived immutable caching (hashed filenames)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
