name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + coverage gate)
    runs-on: ubuntu-24.04
    env:
      ENV: test
      DB_DIALECT: sqlite
      DB_NAME: /tmp/ci-tests.sqlite3
      DB_SEED_DEMO: "true"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip uninstall -y playwright || true
      - name: Lint (ruff)
        run: |
          python -m ruff check app tests scripts
      - name: Test (coverage gate 80% via .coveragerc)
        run: |
          set +e
          python -m pytest -q --tb=short -rf | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface the failures as check annotations: this environment has no
            # access to the raw job log, annotations are the readable channel.
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | head -10 | while IFS= read -r failure; do
              echo "::error title=pytest failure::${failure}"
            done
            tail -n 25 /tmp/pytest.log | sed 's/%/%25/g' | tr '\n' '\r' > /tmp/tail.txt
            while IFS= read -r chunk; do echo "::error title=pytest output::${chunk}"; done < /tmp/tail.txt
          fi
          exit "$status"
      - name: API smoke (64 checks, in-process)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -f /tmp/smoke.sqlite3*
          DB_NAME=/tmp/smoke.sqlite3 python scripts/smoke_api.py

  frontend:
    name: Frontend (lint + build + tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rpa-dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rpa-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Component + RTL/Arabic DOM contracts, bundle-size budgets and the
      # accessibility audits run against the build produced above.
      - run: npm test

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python dependencies audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict || true
      - name: Node dependencies audit
        working-directory: rpa-dashboard
        run: |
          npm ci
          npm audit --audit-level=critical || true
      # Hard gate (no args input — v2's `args` was invalid — and no
      # continue-on-error): the action scans the PR/push commit range
      # with the committed .gitleaks.toml.  A separate full-history audit
      # found pre-v4 secrets that must be rotated (see PR description);
      # they are deliberately NOT allowlisted here.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
