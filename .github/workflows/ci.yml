name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + coverage gate)
    runs-on: ubuntu-24.04
    env:
      ENV: test
      DB_DIALECT: sqlite
      DB_NAME: /tmp/ci-tests.sqlite3
      DB_SEED_DEMO: "true"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip uninstall -y playwright || true
      - name: Lint (ruff)
        run: |
          python -m ruff check app tests scripts
      - name: Test (coverage gate 80% via .coveragerc)
        run: python -m pytest
      - name: API smoke (64 checks, in-process)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          rm -f /tmp/smoke.sqlite3*
          DB_NAME=/tmp/smoke.sqlite3 python scripts/smoke_api.py

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rpa-dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rpa-dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python dependencies audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict || true
      - name: Node dependencies audit
        working-directory: rpa-dashboard
        run: |
          npm ci
          npm audit --audit-level=critical || true
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          set +e
          /tmp/gitleaks git --config .gitleaks.toml --redact --exit-code 1 --report-format json --report-path /tmp/gitleaks.json . 2>&1 | tee /tmp/gitleaks.log
          scan_code=${PIPESTATUS[0]}
          set -e
          python3 scripts/ci_gitleaks_summary.py /tmp/gitleaks.json /tmp/gitleaks.log
          exit $scan_code
